name: Desert Frontline CI Results

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  ci-results:
    name: Build and package CI results
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare CI results
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ci-results .derivedData-ci
          mkdir -p ci-results
          cp ci/probes.json ci-results/probes.json
          version="$(git log -1 --pretty=%s | sed -E 's/^([^:]+):.*/\1/')"
          if [[ ! "$version" =~ ^v[0-9]+(\.[0-9]+)?$ ]]; then version="unversioned"; fi
          echo "CI_VERSION=$version" >> "$GITHUB_ENV"
          printf 'Desert Frontline CI run %s attempt %s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > ci-results/ci-run.log

      - name: Static checks
        id: static-checks
        timeout-minutes: 2
        continue-on-error: true
        shell: bash
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          set -o pipefail
          {
            set -e
            python3 ci/check_watchdog.py
            python3 ci/check_probe_runner.py
            zero_sha="0000000000000000000000000000000000000000"
            if [[ -n "${BASE_SHA:-}" && "$BASE_SHA" != "$zero_sha" ]] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              git diff --check "$BASE_SHA" HEAD
            elif git rev-parse HEAD^ >/dev/null 2>&1; then
              git diff --check HEAD^ HEAD
            else
              git diff --check
            fi
          } 2>&1 | tee ci-results/static-checks.log

      - name: Project lint
        id: project-lint
        timeout-minutes: 1
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          plutil -lint DesertFrontline.xcodeproj/project.pbxproj 2>&1 | tee ci-results/project-lint.log

      - name: Xcode generic iOS build
        id: xcode-build
        timeout-minutes: 12
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          rm -rf ci-results/DesertFrontline.xcresult .derivedData-ci
          python3 ci/run_bounded.py 600 /Applications/Xcode.app/Contents/Developer/usr/bin/xcodebuild \
            -project DesertFrontline.xcodeproj \
            -scheme DesertFrontline \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath .derivedData-ci \
            -resultBundlePath ci-results/DesertFrontline.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee ci-results/xcodebuild.log

      - name: iOS simulator launch probe
        id: simulator-launch
        # 1080s shared work + <=90s diagnostics/cleanup < 1260s step deadline.
        timeout-minutes: 21
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 ci/simulator_probe.py 2>&1 | tee ci-results/simulator-launch.log

      - name: Write manifest and summaries
        id: package-metadata
        if: always()
        timeout-minutes: 3
        shell: bash
        env:
          STATIC_OUTCOME: ${{ steps.static-checks.outcome }}
          PROJECT_LINT_OUTCOME: ${{ steps.project-lint.outcome }}
          BUILD_OUTCOME: ${{ steps.xcode-build.outcome }}
          SIMULATOR_LAUNCH_OUTCOME: ${{ steps.simulator-launch.outcome }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: python3 ci/package_results.py

      - name: Upload CI results
        if: always() && steps.package-metadata.outputs.artifact_name != ''
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package-metadata.outputs.artifact_name }}
          path: ci-results
          if-no-files-found: error
          retention-days: 14

      - name: Fail on unsuccessful checks
        if: always()
        shell: bash
        env:
          STATIC_OUTCOME: ${{ steps.static-checks.outcome }}
          PROJECT_LINT_OUTCOME: ${{ steps.project-lint.outcome }}
          BUILD_OUTCOME: ${{ steps.xcode-build.outcome }}
          SIMULATOR_LAUNCH_OUTCOME: ${{ steps.simulator-launch.outcome }}
          INTEGRITY_OUTCOME: ${{ steps.package-metadata.outputs.integrity_outcome }}
          METADATA_OUTCOME: ${{ steps.package-metadata.outcome }}
        run: |
          set -euo pipefail
          if [[ "$STATIC_OUTCOME" != "success" || "$PROJECT_LINT_OUTCOME" != "success" || "$BUILD_OUTCOME" != "success" || "$SIMULATOR_LAUNCH_OUTCOME" != "success" || "$INTEGRITY_OUTCOME" != "success" || "$METADATA_OUTCOME" != "success" ]]; then
            echo "One or more CI checks failed. Download the CI results artifact for details."
            exit 1
          fi
